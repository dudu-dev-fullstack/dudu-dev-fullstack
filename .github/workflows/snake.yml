name: Generate Profile Widgets
 
on:
  schedule:
    - cron: "0 3 * * *"   # roda todo dia às 03:00 UTC (~00:00 em São Paulo)
  workflow_dispatch: {}    # permite rodar manualmente pela aba Actions
  push:
    branches:
      - main
 
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: dudu-dev-fullstack
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
 
      - name: Generate trophy.svg
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: dudu-dev-fullstack
          output_path: dist/trophy.svg
          theme: algolia
          no-frame: "true"
          no-bg: "true"
          column: "7"
          token: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
